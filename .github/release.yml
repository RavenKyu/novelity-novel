# Categories for GitHub's generated release notes, which prepare-release.yml turns into
# the CHANGELOG.md section. The same labels decide the automatic version bump
# (scripts/release): breaking → major (minor before 1.0), feature → minor, otherwise patch.
changelog:
  exclude:
    labels:
      - release
  categories:
    - title: 호환성 변경
      labels:
        - breaking
    - title: 새 기능
      labels:
        - feature
    - title: 버그 수정
      labels:
        - fix
    - title: 기타
      labels:
        - '*'
