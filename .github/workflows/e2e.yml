# End-to-end tests against the containerized app (compose profile "app"; non-required check).
#
# Kept out of verify-pull-request.yml on purpose — see the note there. Runs on PRs to
# main so regressions are visible, and on demand. Real Google sign-in is never
# exercised here: specs seed a user + session in MongoDB (tests/e2e/fixtures.ts).
name: E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # core-api and web are behind this profile; set job-wide so up, logs and down all include them.
      COMPOSE_PROFILES: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        # --wait blocks until every service with a healthcheck is healthy.
        run: docker compose up -d --build --wait

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install e2e dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e

      - name: Upload traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop stack
        if: always()
        run: docker compose down -v
