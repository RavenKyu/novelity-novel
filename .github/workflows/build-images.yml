# Build the service images (nn-core-api-server, nn-web-server).
#
# Status: build only. There is no container registry yet, so the images are built
# (which proves the Dockerfiles still work on main) and then discarded. Everything
# needed to publish is already written below and commented out — see "To enable
# publishing" and uncomment the marked blocks.
#
# To enable publishing (example: GitHub Container Registry):
#   1. Pick the registry and set REGISTRY / IMAGE_PREFIX below.
#      - GHCR: ghcr.io/<owner>, authenticates with GITHUB_TOKEN (needs `packages: write`).
#      - ECR/GCR/Docker Hub: replace the login step with the registry's login action
#        and store credentials in repository secrets.
#   2. Uncomment `packages: write`, the "Log in" step, the metadata step, and switch
#      the build step to `push: true` with the metadata tags/labels.
#   3. Decide the tag policy (metadata-action below: branch, semver tag, short sha).
name: Build images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # packages: write   # ← uncomment for GHCR publishing

# env:
#   REGISTRY: ghcr.io
#   IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nn-core-api-server
            context: apps/core-api
          - image: nn-web-server
            context: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Log in to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Image tags and labels
      #   id: meta
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
      #     tags: |
      #       type=ref,event=branch
      #       type=semver,pattern={{version}}
      #       type=semver,pattern={{major}}.{{minor}}
      #       type=sha,format=short

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # When publishing, replace `push` and `tags` above with:
          # push: true
          # tags: ${{ steps.meta.outputs.tags }}
          # labels: ${{ steps.meta.outputs.labels }}
