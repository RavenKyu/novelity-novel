name: novelity-novel

services:
  nn-mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-novelity}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-novelity-dev}
    ports:
      # Host-local only, for mongosh/Compass.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    networks: [database]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The containerized app is opt-in (profile "app"): CI e2e and production-like checks.
  # Day-to-day development runs core-api and web on the host with live reload (scripts/dev),
  # so a plain `docker compose up` starts MongoDB only.
  #   docker compose --profile app up -d --build
  nn-core-api-server:
    profiles: [app]
    build: ./apps/core-api
    image: nn-core-api-server:local
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-novelity}:${MONGO_ROOT_PASSWORD:-novelity-dev}@nn-mongodb:27017/?authSource=admin
      MONGO_DB: novelity
      STUDIO_URL: ${STUDIO_URL:-http://localhost:8000}
      BOOKSTORE_URL: ${BOOKSTORE_URL:-http://localhost:8001}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:8002}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      # Public API never mounts /api/admin.
      API_SURFACES: studio,store
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_TTL: ${SESSION_TTL:-168h}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    networks: [public, database]
    expose:
      - "8080"
    depends_on:
      nn-mongodb:
        condition: service_healthy
    restart: unless-stopped

  nn-studio-web-server:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/studio-web/Dockerfile
    image: nn-studio-web-server:local
    networks: [public]
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      - nn-core-api-server
    restart: unless-stopped

  nn-bookstore-web-server:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/bookstore-web/Dockerfile
    image: nn-bookstore-web-server:local
    networks: [public]
    environment:
      CORE_API_URL: http://nn-core-api-server:8080
      BOOKSTORE_URL: ${BOOKSTORE_URL:-http://localhost:8001}
      STUDIO_URL: ${STUDIO_URL:-http://localhost:8000}
      ORIGIN: ${BOOKSTORE_URL:-http://localhost:8001}
    ports:
      - "${BOOKSTORE_PORT:-8001}:3000"
    depends_on:
      - nn-core-api-server
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Opt-in administrator surface. No public web has a route or network to these services.
  nn-admin-core-api-server:
    profiles: [admin]
    build: ./apps/core-api
    image: nn-core-api-server:local
    networks: [admin, database]
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-novelity}:${MONGO_ROOT_PASSWORD:-novelity-dev}@nn-mongodb:27017/?authSource=admin
      MONGO_DB: novelity
      ADMIN_URL: ${ADMIN_URL:-http://localhost:8002}
      API_SURFACES: admin
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    expose: ["8080"]
    depends_on:
      nn-mongodb:
        condition: service_healthy
    restart: unless-stopped

  nn-admin-web-server:
    profiles: [admin]
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    image: nn-admin-web-server:local
    networks: [admin]
    # Local/private entry only. A production VPN gateway is configured separately.
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8002}:80"
    depends_on:
      - nn-admin-core-api-server
    restart: unless-stopped

networks:
  public:
  # Keep outbound access for Google OIDC discovery/token exchange.
  admin:
  # A regular bridge preserves the loopback Mongo port for host development.
  database:

volumes:
  mongo-data:
