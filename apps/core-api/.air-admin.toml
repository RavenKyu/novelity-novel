# Live reload for local development, started by `scripts/dev admin-api` (which also sets the env).
# Rebuilds on .go changes and restarts the server on :8081.
root = "."
tmp_dir = "tmp/admin"

[build]
cmd = "go build -o ./tmp/admin/server ./cmd/server"
entrypoint = ["./tmp/admin/server"]
include_ext = ["go"]
# Debounce (default 1000ms); short so a save shows up quickly.
delay = 200
# SIGINT first, so the old server shuts down gracefully (closes Mongo) before the new one binds :8081.
send_interrupt = true
kill_delay = "6s"

[misc]
clean_on_exit = true
