server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Proxying via a variable makes nginx re-resolve the
    # service name, so recreating core-api (new IP) doesn't leave a stale upstream.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api http://nn-core-api-server:8080;

    location /api/ {
        proxy_pass $core_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: unknown paths are client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
